name: Daily website snapshot

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-website-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the daily restore point
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          snapshot_date="$(date -u +%F)"
          snapshot_tag="snapshot-${snapshot_date}"
          printf 'snapshot_date=%s\n' "${snapshot_date}" >> "${GITHUB_OUTPUT}"
          printf 'snapshot_tag=%s\n' "${snapshot_tag}" >> "${GITHUB_OUTPUT}"

          if git rev-parse -q --verify "refs/tags/${snapshot_tag}" >/dev/null; then
            printf 'tag_exists=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'tag_exists=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Create the immutable daily tag
        if: steps.metadata.outputs.tag_exists == 'false'
        env:
          SNAPSHOT_TAG: ${{ steps.metadata.outputs.snapshot_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot_tag="${SNAPSHOT_TAG}"
          git tag -a "${snapshot_tag}" -m "Daily production snapshot ${snapshot_tag}"
          git push origin "refs/tags/${snapshot_tag}"

      - name: Build the downloadable snapshot
        env:
          SNAPSHOT_DATE: ${{ steps.metadata.outputs.snapshot_date }}
          SNAPSHOT_TAG: ${{ steps.metadata.outputs.snapshot_tag }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_tag="${SNAPSHOT_TAG}"
          git archive --format=zip --output "website-${snapshot_tag}.zip" HEAD
          printf 'Snapshot date: %s UTC\nCommit: %s\nTag: %s\n' \
            "${SNAPSHOT_DATE}" "$(git rev-parse HEAD)" "${snapshot_tag}" > snapshot-manifest.txt

      - name: Retain the snapshot for 60 days
        uses: actions/upload-artifact@v4
        with:
          name: website-snapshot-${{ steps.metadata.outputs.snapshot_date }}
          path: |
            website-${{ steps.metadata.outputs.snapshot_tag }}.zip
            snapshot-manifest.txt
          if-no-files-found: error
          retention-days: 60
